name: CI

on:
  push:
    branches: [release, main, 'feat/**', 'fix/**']
  pull_request:
    branches: [release, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20, 22]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      - name: Run linter
        run: npm run lint

      # Tests skipped - no test files exist yet
      # - name: Run tests
      #   run: npm test --if-present

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.node-version }}
          path: |
            apps/api/dist
            apps/mcp/dist
            packages/*/dist
          retention-days: 1

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit fix (if needed)
        run: npm audit fix --if-present
        continue-on-error: true

  deploy-preview:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-20
          path: dist

      - name: Deploy to preview environment
        run: |
          echo "Deploying preview environment for PR #${{ github.event.pull_request.number }}"
          echo "Build artifacts available at: dist/"
        env:
          DEPLOY_ENV: preview
          PR_NUMBER: ${{ github.event.pull_request.number }}
