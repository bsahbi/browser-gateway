name: Firecrawl Docker CD

on:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      deploy_to:
        description: 'Image tag to publish'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - release

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/firecrawl

jobs:
  build-and-push:
    name: Build and push Traefik wrapper (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.deploy_to }}"
          else
            TARGET="${GITHUB_REF_NAME}"
          fi

          case "$TARGET" in
            main) 
              IMAGE_TAG="release"  # main → release tag
              ;;
            release) 
              IMAGE_TAG="latest"   # release → latest tag
              ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 1
              ;;
          esac

          # GHCR image names must be lowercase
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME}"

      - name: Build and push Traefik wrapper
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/firecrawl/Dockerfile.firecrawl
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update docker-compose.sha256
        shell: bash
        run: |
          # Generate SHA256 hash of docker-compose for integrity verification
          sha256sum infra/firecrawl/docker-compose.portainer.yml > infra/firecrawl/docker-compose.portainer.yml.sha256

      - name: Commit and push docker-compose hash
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update docker-compose hash"
          file_pattern: infra/firecrawl/docker-compose.portainer.yml.sha256
