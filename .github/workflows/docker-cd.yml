name: Firecrawl Docker CD

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}/firecrawl

jobs:
  build-and-push:
    name: Build and push Firecrawl (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/firecrawl/Dockerfile.firecrawl
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
